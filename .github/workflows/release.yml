# Neue Version automatisch bereitstellen: Wird APP_VERSION in printdock.py erhöht und auf main
# hochgeladen, prüft dieser Workflow alles und erstellt das Release mit Programm und Installern.
# Ohne neue Versionsnummer passiert nichts. Versionsnummern gehen nie rückwärts.
name: Release

on:
  push:
    branches: [main]
    paths: [printdock.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version lesen
        id: v
        run: |
          VER=$(grep -oP '^APP_VERSION = "\K[0-9.]+' printdock.py)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            echo "v$VER gibt es schon – kein neues Release."
            echo "neu=nein" >> "$GITHUB_OUTPUT"; exit 0
          fi
          LAST=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)
          if [ -n "$LAST" ] && [ "$(printf '%s\n%s\n' "$LAST" "$VER" | sort -V | tail -1)" != "$VER" ]; then
            echo "::error::APP_VERSION $VER ist kleiner als die letzte Version $LAST – Versionen dürfen nie rückwärts gehen."
            exit 1
          fi
          echo "neu=ja" >> "$GITHUB_OUTPUT"
      - name: Prüfen
        if: steps.v.outputs.neu == 'ja'
        run: |
          python3 -m py_compile printdock.py
          pip install -q pyflakes && python3 -m pyflakes printdock.py
          for f in linux/*.sh; do bash -n "$f"; done
      - name: Release erstellen
        if: steps.v.outputs.neu == 'ja'
        run: |
          VER=${{ steps.v.outputs.ver }}
          EXTRA=()
          if [ "$VER" = "1.0.35" ]; then
            # Umbenennung Druckzentrale -> PrintDock: aeltere Fassungen und alte Doppelklick-Installer
            # laden diese Namen; dieselben Dateien einmalig auch darunter bereitstellen
            cp printdock.py /tmp/druckzentrale.py; cp linux/PrintDock-installieren.sh /tmp/Druckzentrale-installieren.sh
            EXTRA=(/tmp/druckzentrale.py /tmp/Druckzentrale-installieren.sh)
          fi
          gh release create "v$VER" printdock.py linux/PrintDock-installieren.sh \
            linux/PrintDock-arch-installer.desktop linux/PrintDock-deb-installer.desktop \
            linux/PrintDock-installer.desktop "${EXTRA[@]}" --target "$GITHUB_SHA" \
            --title "PrintDock v$VER" --generate-notes --latest
